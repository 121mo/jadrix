<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jadrix ERP</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Tahoma,Arial;background:#07111f;color:#eef5ff}
    .hidden{display:none!important}
    .login{min-height:100vh;display:grid;place-items:center;padding:20px}
    .card{width:min(420px,95vw);background:#111e32;border:1px solid #263852;border-radius:18px;padding:25px}
    input,button{width:100%;padding:12px;margin:7px 0;border-radius:9px;border:1px solid #263852;font:inherit}
    input{background:#081424;color:white}
    button{background:#1fbf75;color:#03291a;font-weight:bold;cursor:pointer}
    header{display:flex;justify-content:space-between;align-items:center;padding:15px 22px;background:#081323;border-bottom:1px solid #263852}
    main{padding:22px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
    .panel{background:#111e32;border:1px solid #263852;border-radius:14px;padding:18px}
    .value{font-size:28px;color:#38bdf8;font-weight:bold;margin-top:8px}
    .error{color:#fca5a5}
    .muted{color:#9cadc3;font-size:13px}
  </style>
</head>
<body>

<section id="loginView" class="login">
  <div class="card">
    <h1>Jadrix ERP</h1>
    <p class="muted">تسجيل الدخول إلى النظام المالي</p>

    <input id="email" value="admin@jadrix.local" placeholder="البريد الإلكتروني">
    <input id="password" value="admin123" type="password" placeholder="كلمة المرور">

    <button id="loginButton">دخول</button>
    <div id="loginMessage" class="error"></div>
  </div>
</section>

<section id="appView" class="hidden">
  <header>
    <div>
      <strong>Jadrix ERP</strong>
      <div id="context" class="muted"></div>
    </div>
    <button id="logoutButton" style="width:auto;background:#26374e;color:white">خروج</button>
  </header>

  <main>
    <h2>لوحة التحكم المالية</h2>

    <div class="grid">
      <div class="panel">
        <div>عدد الحسابات</div>
        <div id="accountsCount" class="value">0</div>
      </div>

      <div class="panel">
        <div>عدد القيود</div>
        <div id="entriesCount" class="value">0</div>
      </div>

      <div class="panel">
        <div>المستخدم الحالي</div>
        <div id="currentUser" class="value" style="font-size:20px">—</div>
      </div>

      <div class="panel">
        <div>حالة الخادم</div>
        <div class="value" style="color:#86efac">متصل</div>
      </div>
    </div>
  </main>
</section>

<script>
  let token = localStorage.getItem("jadrix_token") || "";

  async function api(url, options = {}) {
    const response = await fetch(url, {
      ...options,
      headers: {
        "Content-Type": "application/json",
        ...(token ? { Authorization: `Bearer ${token}` } : {})
      }
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "حدث خطأ");
    }

    return data;
  }

  async function login() {
    loginMessage.textContent = "";

    try {
      const result = await api("/api/login", {
        method: "POST",
        body: JSON.stringify({
          email: email.value,
          password: password.value
        })
      });

      token = result.token;
      localStorage.setItem("jadrix_token", token);
      await openApp();
    } catch (error) {
      loginMessage.textContent = error.message;
    }
  }

  async function openApp() {
    try {
      const [bootstrap, accounts, entries] = await Promise.all([
        api("/api/bootstrap"),
        api("/api/accounts"),
        api("/api/journal-entries")
      ]);

      loginView.classList.add("hidden");
      appView.classList.remove("hidden");

      const company = bootstrap.companies[0];
      const branch = bootstrap.branches[0];
      const fiscalYear = bootstrap.fiscalYears[0];

      context.textContent =
        `${company.nameAr} — ${branch.nameAr} — ${fiscalYear.name}`;

      currentUser.textContent = bootstrap.user.name;
      accountsCount.textContent = accounts.length;
      entriesCount.textContent = entries.length;
    } catch {
      localStorage.removeItem("jadrix_token");
      token = "";
      loginView.classList.remove("hidden");
      appView.classList.add("hidden");
    }
  }

  loginButton.onclick = login;

  logoutButton.onclick = () => {
    localStorage.removeItem("jadrix_token");
    location.reload();
  };

  if (token) {
    openApp();
  }
</script>

</body>
</html>
